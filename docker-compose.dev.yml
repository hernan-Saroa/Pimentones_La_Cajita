# Desarrollo: base de datos en Docker; API, worker y web corren con recarga en caliente.
# Uso: docker compose -f docker-compose.dev.yml up
name: lacajita-dev
services:
  db:
    image: postgres:16-alpine
    ports: ["5434:5432"]
    environment: { POSTGRES_DB: lacajita, POSTGRES_USER: lacajita, POSTGRES_PASSWORD: lacajita }
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lacajita"], interval: 5s, retries: 10 }

  api:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm install && npm run build -w packages/shared && npm run dev -w apps/api"
    environment:
      DATABASE_URL: postgres://lacajita:lacajita@db:5432/lacajita
      JWT_SECRET: secreto-de-desarrollo-largo-123
      ADMIN_EMAIL: admin@pimentoneslacajita.com
      ADMIN_PASSWORD: clave-de-desarrollo
      PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JOBS_INLINE: "true"
      LOG_PRETTY: "true"
    ports: ["4000:4000"]
    volumes: [.:/repo, node_modules_dev:/repo/node_modules]
    depends_on: { db: { condition: service_healthy } }

  web:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm run dev -w apps/web"
    environment: { API_URL: http://api:4000, NEXT_PUBLIC_SITE_URL: http://localhost:3000 }
    ports: ["3000:3000"]
    volumes: [.:/repo, node_modules_dev:/repo/node_modules]
    depends_on: [api]

volumes:
  pgdata_dev:
  node_modules_dev:
