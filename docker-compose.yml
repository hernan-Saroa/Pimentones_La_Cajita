# Producción: un comando levanta todo. Variables en .env (ver .env.example).
name: lacajita
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { SITE_DOMAIN: "${SITE_DOMAIN:-localhost}" }
    volumes: [./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web, api]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_SITE_URL: "${SITE_URL:-http://localhost}" } }
    image: lacajita/web:${TAG:-latest}
    restart: unless-stopped
    environment: { API_URL: http://api:4000 }
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512M } } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: lacajita/api:${TAG:-latest}
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://lacajita:${DB_PASSWORD:?Define DB_PASSWORD en .env}@db:5432/lacajita
      PUBLIC_URL: "${SITE_URL:-http://localhost}"
      CORS_ORIGINS: "${SITE_URL:-http://localhost}"
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/repo/apps/api/uploads]
    deploy: { resources: { limits: { memory: 512M } } }

  worker:
    image: lacajita/api:${TAG:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://lacajita:${DB_PASSWORD}@db:5432/lacajita
      PUBLIC_URL: "${SITE_URL:-http://localhost}"
      NODE_ENV: production
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 384M } } }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: lacajita, POSTGRES_USER: lacajita, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lacajita -d lacajita"], interval: 5s, timeout: 5s, retries: 12 }
    deploy: { resources: { limits: { memory: 1G } } }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/scripts/entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://lacajita:${DB_PASSWORD}@db:5432/lacajita
      BACKUP_CRON: "${BACKUP_CRON:-0 3 * * *}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes: [./infra/backup:/scripts:ro, backups:/backups]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
