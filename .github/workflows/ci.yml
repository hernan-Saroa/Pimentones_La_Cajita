name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: lacajita, POSTGRES_USER: lacajita, POSTGRES_PASSWORD: lacajita }
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run build -w apps/api
      - run: npm test -w apps/api
      - name: Validar archivos Docker
        run: docker compose config -q && docker compose -f docker-compose.dev.yml config -q
      - name: Compilar web contra la API real
        env:
          DATABASE_URL: postgres://lacajita:lacajita@localhost:5432/lacajita
          JWT_SECRET: secreto-de-ci-suficientemente-largo
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: clave-de-ci-8
          API_URL: http://localhost:4000
        run: |
          (cd apps/api && node dist/main.js &) ; sleep 6
          npm run build -w apps/web
          npm run lint -w apps/web
  images:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest", cache-from: type=gha, cache-to: "type=gha,mode=max", build-args: "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}" }
